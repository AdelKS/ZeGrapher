# The site's short strings, outside the panels. Translate the values, and keep
# the keys.

# the language name, in that language. The language menu at the top of each
# page lists the languages by this name. This key has no English fallback, so
# every language must set it
language: Español

# the page title, which the browser shows in the tab
page_title: ZeGrapher, software libre para trazar gráficas

# the line under the landing panel title. Search engines also show it as the
# page description
tagline: Un programa de gráficas matemáticas libre, gratuito y fácil de usar. Traza funciones, sucesiones, ecuaciones paramétricas y datos experimentales en el plano.

# the footer entries
footer:
  donate: Donar
  contact: Contacto
  theme-based-on: Basado en

# the page button labels. Screen readers read them, and the theme switch label
# also shows as a tooltip
buttons:
  theme: Cambiar entre el tema claro y el oscuro
  previous: Anterior
  next: Siguiente

# the line above the download tiles. The build replaces {version} with the
# version, and {date} with the release date
release: "Versión {version}, publicada el {date}"

# the GitHub repository tile: its name, and the two smaller links below it
downloads:
  source: Código fuente
  releases: Versiones
  issues: Incidencias

# the gallery captions, by file name. The site uses them as alt text, and
# software centers show them under the screenshots
gallery:
  vitrine.png: "Una curva en coordenadas polares, trazada para varios valores de una constante a la vez"
  functions.png: "Una función y una sucesión en la misma gráfica"
  schrodinger.png: "Modo Schrödinger: una curva por cada valor de la constante"
  data.png: "Datos medidos, en una tabla y en la gráfica"

# the donation appeal, in markdown. The site shows it in the download panel,
# and the app shows it above its Donate button
donation: Si ZeGrapher te resulta útil, ¡considera hacer una donación para apoyarlo!
