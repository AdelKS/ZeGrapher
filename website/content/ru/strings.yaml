# The site's short strings, outside the panels. Translate the values, and keep
# the keys.

# the language name, in that language. The language menu at the top of each
# page lists the languages by this name. This key has no English fallback, so
# every language must set it
language: Русский

# the page title, which the browser shows in the tab
page_title: ZeGrapher, свободная программа для построения графиков

# the line under the landing panel title. Search engines also show it as the
# page description
tagline: Свободная, бесплатная и простая программа для математических графиков. Строит на плоскости функции, последовательности, параметрические уравнения и данные опытов.

# the footer entries
footer:
  donate: Поддержать
  contact: Связаться
  theme-based-on: На основе

# the page button labels. Screen readers read them, and the theme switch label
# also shows as a tooltip
buttons:
  theme: Переключение светлой и тёмной темы
  previous: Назад
  next: Вперёд

# the line above the download tiles. The build replaces {version} with the
# version, and {date} with the release date
release: "Версия {version}, выпущена {date}"

# the GitHub repository tile: its name, and the two smaller links below it
downloads:
  source: Исходный код
  releases: Версии
  issues: Ошибки

# the gallery captions, by file name. The site uses them as alt text, and
# software centers show them under the screenshots
gallery:
  vitrine.png: "Кривая в полярных координатах, построенная сразу для нескольких значений константы"
  functions.png: "Функция и последовательность на одном графике"
  schrodinger.png: "Режим Шрёдингера: по одной кривой на каждое значение константы"
  data.png: "Данные измерений в таблице и на графике"

# the donation appeal, in markdown. The site shows it in the download panel,
# and the app shows it above its Donate button
donation: Если ZeGrapher вам полезна, поддержите её пожертвованием!
