# The site's short strings, outside the panels. Translate the values, and keep
# the keys.

# the language name, in that language. The language menu at the top of each
# page lists the languages by this name. This key has no English fallback, so
# every language must set it
language: Deutsch

# the page title, which the browser shows in the tab
page_title: ZeGrapher, freie Software zum Zeichnen von Graphen

# the line under the landing panel title. Search engines also show it as the
# page description
tagline: Ein freies, kostenloses und leicht zu bedienendes Programm für mathematische Graphen. Es zeichnet Funktionen, Folgen, Parameterdarstellungen und Messdaten in der Ebene.

# the footer entries
footer:
  donate: Spenden
  contact: Kontakt
  theme-based-on: Basierend auf

# the page button labels. Screen readers read them, and the theme switch label
# also shows as a tooltip
buttons:
  theme: Zwischen hellem und dunklem Design wechseln
  previous: Zurück
  next: Weiter

# the line above the download tiles. The build replaces {version} with the
# version, and {date} with the release date
release: "Version {version}, veröffentlicht am {date}"

# the GitHub repository tile: its name, and the two smaller links below it
downloads:
  source: Quellcode
  releases: Versionen
  issues: Fehlerberichte

# the gallery captions, by file name. The site uses them as alt text, and
# software centers show them under the screenshots
gallery:
  vitrine.png: "Eine Kurve in Polarkoordinaten, für mehrere Werte einer Konstante auf einmal gezeichnet"
  functions.png: "Eine Funktion und eine Folge im selben Graphen"
  schrodinger.png: "Schrödinger-Modus: eine Kurve pro Wert der Konstante"
  data.png: "Messdaten, in einer Tabelle und im Graphen"

# the donation appeal, in markdown. The site shows it in the download panel,
# and the app shows it above its Donate button
donation: Wenn dir ZeGrapher nützt, unterstütze es mit einer Spende!
