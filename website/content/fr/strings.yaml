# The site's short strings, outside the panels. Translate the values, and keep
# the keys.

# the language name, in that language. The language menu at the top of each
# page lists the languages by this name. This key has no English fallback, so
# every language must set it
language: Français

# the page title, which the browser shows in the tab
page_title: ZeGrapher, logiciel de tracé de courbes libre

# the line under the landing panel title. Search engines also show it as the
# page description
tagline: Logiciel de tracé de courbes libre, gratuit et simple d'emploi. Il trace fonctions, suites, équations paramétriques et tableaux de valeurs dans le plan.

# the footer entries
footer:
  donate: Faire un don
  contact: Contact
  theme-based-on: D'après

# the page button labels. Screen readers read them, and the theme switch label
# also shows as a tooltip
buttons:
  theme: Basculer entre le thème clair et le thème sombre
  previous: Précédent
  next: Suivant

# the line above the download tiles. The build replaces {version} with the
# version, and {date} with the release date
release: "Version {version}, sortie le {date}"

# the GitHub repository tile: its name, and the two smaller links below it
downloads:
  source: Code source
  releases: Versions
  issues: Tickets

# the gallery captions, by file name. The site uses them as alt text, and
# software centers show them under the screenshots
gallery:
  vitrine.png: "Une courbe polaire, tracée pour plusieurs valeurs d’une constante à la fois"
  functions.png: "Une fonction et une suite sur le même graphe"
  schrodinger.png: "Mode Schrödinger : une courbe par valeur de la constante"
  data.png: "Des données mesurées, dans un tableau et sur le graphe"

# the donation appeal, in markdown. The site shows it in the download panel,
# and the app shows it above its Donate button
donation: Si ZeGrapher vous est utile, pensez à faire un don pour le soutenir !
