<!DOCTYPE HTML>
<!--
	ZeGrapher website theme — Astral by HTML5 UP (html5up.net | @ajlkn),
	reworked by Adel Kara Slimane to pure HTML + CSS (no JavaScript).

	The page layout template. build-website.py fills each {{ ... }} slot.
-->
<html lang="{{ lang }}">
	<head>
		<title>{{ title }}</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="description" content="{{ description }}" />
		<link rel="stylesheet" href="../assets/css/main.css?v={{ css_version }}" />
		{{ nav_active }}
		<link rel="icon" type="image/svg+xml" href="../assets/images/ZeGrapher.svg" />
	</head>
	<body>
		<div id="wrapper">
			<div class="navcontainer">

				<img class="logo" src="../assets/images/ZeGrapher.svg" alt="ZeGrapher" />

				<div style="flex-grow: 10; flex-basis: 0; flex-shrink: 10;"></div>

				<nav id="nav" style="flex-shrink: 0;">
					{{ nav }}
				</nav>

				<div id="tools">

					<!-- The theme switch. The checkbox holds the state, which the
					     main.css palette reads. Both glyphs are here, and the palette
					     shows the one that switches to the other theme. -->
					<input type="checkbox" id="theme-switch"
					       aria-label="{{ theme_label }}" />
					<label for="theme-switch" class="theme-toggle"
					       title="{{ theme_label }}">
						<span class="moon" aria-hidden="true">{{ moon_icon }}</span>
						<span class="sun" aria-hidden="true">{{ sun_icon }}</span>
					</label>

					<!-- The language menu. It stays empty while the site has only one
					     language. -->
					<nav id="langs">
						{{ languages }}
					</nav>

				</div>
			</div>

			<div id="main">

				<!-- The previous/next arrows come before the panels, so the panels
				     paint over them. They are fixed, so their position in the markup
				     changes nothing else. -->
				{{ arrows }}

				{{ content }}
			</div>

			{{ footer }}

		</div>

	</body>
</html>
