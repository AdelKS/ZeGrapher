name: linux build & bundle
on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string

jobs:
  build-bundle:
    runs-on: ${{ inputs.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Ubuntu Qt packages currently don't have the FluentWinUI3 style
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.*'
          modules: 'qtshadertools'

      # aqtinstall rewrites the .pc prefixes for the 'linux' host only, and meson
      # finds moc and rcc through them
      - name: Patch the Qt pkg-config files
        if: runner.arch == 'ARM64'
        run: sed -i "s|prefix=/home/qt/work/install|prefix=$QT_ROOT_DIR|" "$QT_ROOT_DIR"/lib/pkgconfig/*.pc

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ libxcb-cursor0
          # Qt's xcb platform plugin dependencies, for the render test under xvfb
          sudo apt-get install -y xvfb libgl1-mesa-dri libxkbcommon-x11-0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xkb1

      # the render test draws in an xvfb-run window, with Mesa's OpenGL
      - name: Build, test & bundle
        run: xvfb-run -a ./deploy/linux-bundle-appimage.sh
        env:
          ZG_RENDER_TEST: 1

      # linuxdeploy exits 0 when it misses a QML module, and the app then
      # aborts at startup. A timeout (124) means the app is still running.
      # The settings turn off the update check, so CI doesn't count as a user
      - name: Check that the AppImage starts
        run: |
          mkdir -p "$XDG_CONFIG_HOME/ZeGrapher"
          printf 'app:\n  check_updates: false\n' > "$XDG_CONFIG_HOME/ZeGrapher/settings.yaml"
          xvfb-run -a timeout -k 5 10 deploy/ZeGrapher*AppImage || [[ $? == 124 ]]
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          XDG_CONFIG_HOME: ${{ runner.temp }}/config

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-artifact-${{ inputs.runner }}
          path: deploy/ZeGrapher*AppImage
