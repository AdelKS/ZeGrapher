name: Build & Release for all platforms
on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  build-linux-x64:
    uses: ./.github/workflows/linux-build-bundle.yml

  build-windows-x64:
    uses: ./.github/workflows/windows-build-bundle.yml
    with:
      msystem: UCRT64

  build-macos-x64:
    uses: ./.github/workflows/macos-build-bundle.yml
    with:
      runner: macos-26-intel

  build-macos-arm64:
    uses: ./.github/workflows/macos-build-bundle.yml
    with:
      runner: macos-26

  make-release:
    if: github.ref_name == github.event.repository.default_branch && github.repository == 'AdelKS/ZeGrapher'

    runs-on: ubuntu-24.04

    needs:
      - build-linux-x64
      - build-windows-x64
      - build-macos-x64
      - build-macos-arm64

    outputs:
      is_prerelease: ${{ steps.release.outputs.is_prerelease }}

    steps:

      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Download release artifacts
        uses: actions/download-artifact@v5
        with:
          merge-multiple: true
          path: deploy

      - name: Install Dependencies
        run: |
          sudo apt install python3-pip jq
          pip3 install --user meson ninja

      - name: Make new release or prerelease
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          version=$(./version.sh)

          # a '-dev' suffix marks a commit between two releases
          if [[ "$version" == *-dev ]]; then
            echo "$version is a development version, not making a release"
            exit 0
          fi

          if gh release view "v$version" &> /dev/null; then
            echo "v$version is released already"
            exit 0
          fi

          # alpha, beta and rc are the keywords of a version that is not final
          prerelease=""
          release_type="full"
          if [[ "$version" =~ (alpha|beta|rc) ]]; then
            prerelease="--prerelease"
            release_type="${BASH_REMATCH[1]}"
          fi
          echo "release_type=$release_type" >> "$GITHUB_OUTPUT"

          # the tag comes with the release below, so release-notes.md names
          # this version as the release under work
          notes=$(python3 appdata/releases.py --summary)

          files_list=$(find deploy -maxdepth 1 -name 'ZeGrapher*' -type f | paste -sd' ')
          gh release create "v$version" $files_list \
          --title "v$version" --notes "$notes" --generate-notes $prerelease

  deploy-website:
    needs: make-release
    # the site follows a release candidate and a full release. A run that makes
    # no release writes no type, and the site stays as it is
    if: contains(fromJSON('["full", "rc"]'), needs.make-release.outputs.release_type)
    uses: ./.github/workflows/website-deploy.yml
    secrets: inherit
