name: Build & Release for all platforms
on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  build-linux-x64:
    uses: ./.github/workflows/linux-build-bundle.yml

  build-windows-x64:
    uses: ./.github/workflows/windows-build-bundle.yml
    with:
      msystem: UCRT64

  build-macos-x64:
    uses: ./.github/workflows/macos-build-bundle.yml
    with:
      runner: macos-26-intel

  build-macos-arm64:
    uses: ./.github/workflows/macos-build-bundle.yml
    with:
      runner: macos-26

  make-release:
    if: github.ref_name == github.event.repository.default_branch && github.repository == 'AdelKS/ZeGrapher'

    runs-on: ubuntu-24.04

    needs:
      - build-linux-x64
      - build-windows-x64
      - build-macos-x64
      - build-macos-arm64

    outputs:
      release_type: ${{ steps.release.outputs.release_type }}

    steps:

      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Download release artifacts
        uses: actions/download-artifact@v5
        with:
          merge-multiple: true
          path: deploy

      - name: Install Dependencies
        run: |
          sudo apt install python3-pip jq
          pip3 install --user meson ninja

      - name: Make new release or prerelease
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          version=$(./version.sh)

          # dev, alpha, beta, rc or full. appdata/releases.py holds the grammar
          # of a version
          release_type=$(python3 appdata/releases.py --release-type)

          if [[ "$release_type" == dev ]]; then
            echo "$version is a development version, not making a release"
            exit 0
          fi

          if gh release view "v$version" &> /dev/null; then
            echo "v$version is released already"
            exit 0
          fi

          prerelease=""
          if [[ "$release_type" != full ]]; then
            prerelease="--prerelease"
          fi
          echo "release_type=$release_type" >> "$GITHUB_OUTPUT"

          # the tag is created with the release below, so at this point
          # release-notes.md still names this version as the release under work
          notes=$(python3 appdata/releases.py --summary)

          # GitHub writes the list of changes under those notes, and it counts
          # them from the release before this one. A heading of release-notes.md
          # can hold a span of releases, and the list then has to run over the
          # whole span: without this, the release that closes a span counts from
          # its own release candidate
          start_tag=$(python3 appdata/releases.py --start-tag)
          notes_start=""
          if [[ -n "$start_tag" ]]; then
            notes_start="--notes-start-tag $start_tag"
          fi

          files_list=$(find deploy -maxdepth 1 -name 'ZeGrapher*' -type f | paste -sd' ')

          # --target puts the tag on the commit whose bundles this run built.
          # Without it the tag lands on whatever the default branch points at
          # when the command runs
          gh release create "v$version" $files_list \
          --target "$GITHUB_SHA" \
          --title "v$version" --notes "$notes" --generate-notes $notes_start $prerelease

  deploy-website:
    needs: make-release
    # Every running ZeGrapher reads 'latest' and 'latest_tag' from the site to
    # find a new release. The site carries a full release only, and
    # build-website.py stops on the bundle of a pre-release.
    # If the job above creates no release, it writes no release type, and the
    # site stays as it is.
    if: needs.make-release.outputs.release_type == 'full'
    uses: ./.github/workflows/website-deploy.yml
    secrets: inherit
