name: Build & Release for all platforms
on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # On the default branch, a run deploys the site and creates the release.
  # Cancelling it during the upload would leave the site without public_html,
  # so runs there wait for the previous one instead
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}

jobs:

  build-linux-x64:
    uses: ./.github/workflows/linux-build-bundle.yml

  build-windows-x64:
    uses: ./.github/workflows/windows-build-bundle.yml
    with:
      msystem: UCRT64

  build-macos-x64:
    uses: ./.github/workflows/macos-build-bundle.yml
    with:
      runner: macos-26-intel
      # Metal setup hangs in this runner's VM, before Qt reports a backend
      render-test: false

  build-macos-arm64:
    uses: ./.github/workflows/macos-build-bundle.yml
    with:
      runner: macos-26

  check-release:
    if: github.ref_name == github.event.repository.default_branch && github.repository == 'AdelKS/ZeGrapher'

    runs-on: ubuntu-24.04

    outputs:
      release_type: ${{ steps.check.outputs.release_type }}

    steps:

      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Install PyYAML
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-yaml

      # Without a release type from this step, the jobs below do nothing
      - name: Check for a new release or prerelease
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          version=$(python3 appdata/releases.py --version)

          # dev, alpha, beta, rc or full. appdata/releases.py defines the version
          # grammar
          release_type=$(python3 appdata/releases.py --release-type)

          if [[ "$release_type" == dev ]]; then
            echo "$version is a development version, not making a release"
            exit 0
          fi

          if gh release view "v$version" &> /dev/null; then
            echo "v$version is released already"
            exit 0
          fi

          # the metainfo file takes each release date from releases.yaml, so
          # that date must match the release commit. Pre-releases are not
          # checked: the metainfo file leaves them out
          if [[ "$release_type" == full ]]; then
            notes_date=$(python3 appdata/releases.py --date)
            commit_date=$(git log -1 --format=%cs)
            if [[ "$notes_date" != "$commit_date" ]]; then
              echo "::error::appdata/releases.yaml dates v$version '$notes_date', and the release commit is from $commit_date"
              exit 1
            fi
          fi

          echo "release_type=$release_type" >> "$GITHUB_OUTPUT"

  deploy-website:
    needs:
      - check-release
      - build-linux-x64
      - build-windows-x64
      - build-macos-x64
      - build-macos-arm64
    # Running ZeGrapher instances read 'latest' and 'latest_tag' from the site
    # to find new releases. The site gets release candidates and full releases,
    # so a release candidate is tested there before the release. This condition
    # is the only check: build-website.py builds any version.
    if: contains(fromJSON('["rc", "full"]'), needs.check-release.outputs.release_type)
    uses: ./.github/workflows/website-deploy.yml
    # the called job gets its environment's secrets only with inherit
    secrets: inherit

  make-release:
    # The release comes after the site. If the site deploy fails, the tag
    # doesn't exist yet, so the next run retries both.
    # GitHub skips a job when a job it needs is skipped, and deploy-website is
    # skipped for alphas and betas. So this condition checks the results of the
    # needed jobs itself.
    if: >-
      !cancelled() && !contains(needs.*.result, 'failure')
      && needs.check-release.outputs.release_type != ''

    runs-on: ubuntu-24.04

    needs:
      - check-release
      - deploy-website
      - build-linux-x64
      - build-windows-x64
      - build-macos-x64
      - build-macos-arm64

    steps:

      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Download release artifacts
        uses: actions/download-artifact@v5
        with:
          merge-multiple: true
          path: deploy

      - name: Install PyYAML
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-yaml

      - name: Make new release or prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TYPE: ${{ needs.check-release.outputs.release_type }}
        run: |
          set -e
          version=$(python3 appdata/releases.py --version)

          prerelease=""
          if [[ "$RELEASE_TYPE" != full ]]; then
            prerelease="--prerelease"
          fi

          # gh release create makes the tag below, so releases.yaml still
          # holds this version as the upcoming release
          notes=$(python3 appdata/releases.py --summary)

          # GitHub appends the list of changes since the previous release. An
          # announcement covers a span of releases, and the list of a full
          # release must cover the whole span: without this, it only lists the
          # changes since its last release candidate
          start_tag=$(python3 appdata/releases.py --start-tag)
          notes_start=""
          if [[ -n "$start_tag" ]]; then
            notes_start="--notes-start-tag $start_tag"
          fi

          files_list=$(find deploy -maxdepth 1 -name 'ZeGrapher*' -type f | paste -sd' ')

          # --target tags the commit this run built the bundles from. Without
          # it, the tag lands wherever the default branch points when the
          # command runs
          gh release create "v$version" $files_list \
          --target "$GITHUB_SHA" \
          --title "v$version" --notes "$notes" --generate-notes $notes_start $prerelease
