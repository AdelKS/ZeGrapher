name: Build & Release for all platforms
on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  build-linux-x64:
    uses: ./.github/workflows/linux-build-bundle.yml

  build-windows-x64:
    uses: ./.github/workflows/windows-build-bundle.yml
    with:
      msystem: UCRT64

  build-macos-x64:
    uses: ./.github/workflows/macos-build-bundle.yml
    with:
      runner: macos-26-intel

  build-macos-arm64:
    uses: ./.github/workflows/macos-build-bundle.yml
    with:
      runner: macos-26

  make-release:
    if: github.ref_name == github.event.repository.default_branch && github.repository == 'AdelKS/ZeGrapher'

    runs-on: ubuntu-24.04

    needs:
      - build-linux-x64
      - build-windows-x64
      - build-macos-x64
      - build-macos-arm64

    steps:

      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Download release artifacts
        uses: actions/download-artifact@v5
        with:
          merge-multiple: true
          path: deploy

      - name: Install Dependencies
        run: |
          sudo apt install python3-pip jq
          pip3 install --user meson ninja

      - name: Make new release or prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          version=$(./version.sh)

          # a '-dev' suffix marks a commit between two releases
          if [[ "$version" == *-dev ]]; then
            echo "$version is a development version, not making a release"
            exit 0
          fi

          if gh release view "v$version" &> /dev/null; then
            echo "v$version is released already"
            exit 0
          fi

          # alpha, beta and rc are the keywords of a version that is not final
          prerelease=""
          if [[ "$version" =~ (alpha|beta|rc) ]]; then
            prerelease="--prerelease"
          fi

          files_list=$(find deploy -maxdepth 1 -name 'ZeGrapher*' -type f | paste -sd' ')
          gh release create "v$version" $files_list \
          --title "v$version" $prerelease
