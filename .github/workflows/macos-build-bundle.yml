name: macOS build & bundle
on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
      render-test:
        type: boolean
        default: true


jobs:
  build-bundle:
    runs-on: ${{ inputs.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # meson imports PyYAML from its own Python, Homebrew has no PyYAML formula,
      # and Homebrew's Python refuses 'pip install' (PEP 668). So meson, ninja
      # and PyYAML go in setup-python's Python
      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install meson
        run: pip3 install meson ninja pyyaml

      # the render test draws with Metal
      - name: Build, test & bundle
        run: ./deploy/macos-bundle-dmg.sh
        env:
          ZG_RENDER_TEST: ${{ inputs.render-test && 1 || 0 }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-artifact-${{ inputs.runner }}
          path: deploy/ZeGrapher*dmg
