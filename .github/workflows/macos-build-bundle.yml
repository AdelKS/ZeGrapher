name: macOS build & bundle
on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
      render-test:
        type: boolean
        default: true


jobs:
  build-bundle:
    runs-on: ${{ inputs.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # the render test draws with Metal
      - name: Build, test & bundle
        run: ./deploy/macos-bundle-dmg.sh
        env:
          ZG_RENDER_TEST: ${{ inputs.render-test && 1 || 0 }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-artifact-${{ inputs.runner }}
          path: deploy/ZeGrapher*dmg
