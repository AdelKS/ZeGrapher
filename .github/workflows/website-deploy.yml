# Builds the site with this run's bundles, and uploads it over SFTP.
#
# The secrets, all set in the Website-Deploy environment:
#   SFTP_HOST         the host that serves the site
#   SFTP_USER         the user of the SFTP account
#   SFTP_KEY          the full private SSH key of that user
#   SFTP_KNOWN_HOSTS  the host's known_hosts line, which pins its key

name: website deploy

on:
  workflow_call:

jobs:
  deploy:
    # a job with uses: can't set environment, so the called job sets it to get its secrets
    environment: Website-Deploy
    runs-on: ubuntu-26.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc lftp python3-yaml

      # The build takes the six bundles for the meson.build version from
      # deploy/, and stops if one is missing.
      - name: Download the bundles
        uses: actions/download-artifact@v5
        with:
          merge-multiple: true
          path: deploy

      - name: Build the site
        run: ./website/scripts/build-website.py

      - name: Write the connect script
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
        run: |
          # the script contains the host and user, so it goes to a file only we
          # can read: command lines are world-readable
          umask 077

          # The SFTP login lands in the home directory. There, `public_html` is
          # a symlink to the web root, and the SFTP server shows it as a
          # directory. Never rename or delete `public_html` itself.

          # without "cmd:fail-exit", lftp reports a failure and still exits with 0
          cat > "$RUNNER_TEMP/connect.lftp" <<EOF
          set cmd:fail-exit yes
          set sftp:connect-program 'ssh -a -x -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -i $HOME/.ssh/deploy_key'
          open -u "$SFTP_USER", "sftp://$SFTP_HOST"
          cd public_html
          EOF

      - name: Upload the site
        env:
          SFTP_KEY: ${{ secrets.SFTP_KEY }}
          SFTP_KNOWN_HOSTS: ${{ secrets.SFTP_KNOWN_HOSTS }}
        run: |
          # 077 gives the private key mode 600 as soon as it is written
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SFTP_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n' "$SFTP_KEY" > ~/.ssh/deploy_key

          if [[ -z $(ls -A build-website 2>/dev/null) ]]; then
            echo "the build wrote no site" >&2
            exit 1
          fi

          # cls -F, its default, appends a "/" to directory names
          listing=$(lftp -c "source $RUNNER_TEMP/connect.lftp; set cmd:cls-default ''; cls -1 -a")

          declare -A live
          while read -r entry; do
            [[ -z $entry ]] || live[$entry]=1
          done <<< "$listing"
          # `analytics/` is not part of the build, and must be kept
          unset 'live[.]' 'live[..]' 'live[analytics]' 'live[.deploy-new]' 'live[.deploy-old]'

          # The script uploads the build to `.deploy-new`, then swaps each entry
          # with a rename, so the site is incomplete only during the renames. The
          # staging directories are inside `public_html`: the web root is its
          # own mount, and a rename into it from the home directory fails. The
          # first line clears what a failed run left.
          {
            cat "$RUNNER_TEMP/connect.lftp"
            echo 'rm -r -f .deploy-new .deploy-old'
            echo 'mirror --reverse --parallel=4 --verbose build-website .deploy-new'
            echo 'mkdir .deploy-old'
            while read -r entry; do
              if [[ -v live[$entry] ]]; then
                echo "mv \"$entry\" \".deploy-old/$entry\""
                unset "live[$entry]"
              fi
              echo "mv \".deploy-new/$entry\" \"$entry\""
            done < <(ls -A build-website)
            for entry in "${!live[@]}"; do
              echo "mv \"$entry\" \".deploy-old/$entry\""
            done
            echo 'rm -r -f .deploy-new .deploy-old'
          } > "$RUNNER_TEMP/upload.lftp"

          lftp -f "$RUNNER_TEMP/upload.lftp"
