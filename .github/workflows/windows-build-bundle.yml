name: Windows build & bundle

on:
  workflow_call:
    inputs:
      msystem:
        required: true
        type: string

jobs:
  build-bundle:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7

      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ inputs.msystem }}
          update: true
          install: git pactoys

      # the render test draws with Direct3D 11
      - name: Build, test & bundle
        env:
          ZG_RENDER_TEST: 1
        run: |
          echo 'Running in MSYS2!'
          ./deploy/windows-bundle-7z.sh

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-artifact-${{ inputs.msystem }}
          path: deploy/ZeGrapher*.7z
