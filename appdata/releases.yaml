# ZeGrapher releases and their notes.
#
# 'releases' lists each release tag with its date, newest first. For the
# upcoming release, the date is the planned release day. Before a full
# release, CI checks that this date matches the release commit date.
# Pre-releases can be left out, since nothing reads their dates.
#
# 'announcements' and 'changes' hold markdown 'text' about a span of releases:
# every release after 'from', up to 'to'. The span excludes 'from', since the
# changes count from it. An entry without 'from' covers 'to' alone. An
# announcement presents a release, and a changes entry lists what changed, for
# example between two release candidates. Each list runs newest first, and
# spans in the same list can't overlap. A tag can name a future release.
#
# appdata/generate-metainfo writes one <release> per full release to the
# metainfo file, which software centers show. Each release takes the text of
# the announcement that ends on it, or else of the changes entry. The app shows
# every entry that covers a release up to its own version, with each
# announcement above the changes entries in its span. A tag's GitHub release
# shows the announcement and changes entry that cover it.

releases:
  - tag: v4.0.0
    date: 2026-10-20
  - tag: v4.0.0_rc0
    date: 2026-10-20
  - tag: v3.1.1
    date: 2020-07-20
  - tag: v3.1
    date: 2020-01-04
  - tag: v3.0.2
    date: 2017-10-09
  - tag: v3.0.1
    date: 2017-03-06
  - tag: v3.0
    date: 2016-04-15

announcements:
  - from: v3.1.1
    to: v4.0.0
    text: |
      It took a long time, it took A LOT of work: I am happy to announce version 4.0!

      - Modern-looking & GPU-accelerated interface, written in [Qt QML](https://doc.qt.io/qt-6/qtqml-index.html)
      - A new math parsing library, [ZeCalculator](https://github.com/AdelKS/ZeCalculator)
        - Useful error messages that point at what is wrong in the expression
        - An arbitrary number of objects
        - Any object can be used in another object's expression
      - Constants that slide between two bounds, by hand or as an animation, or that
        take several values at once to draw a whole family of curves
      - Data sheets: CSV import and export, a table to edit the values, and columns
        filled from any object
      - Improved parametric plots
      - Export to SVG, PDF and image formats, exactly as the graph looks on screen
      - Save your work to a file. The app also saves your latest work on close, and restores it at the next start
      - A manual you can read right in the app, or on the website
      - Support for new languages, but AI-translated: if you see odd wording, please contribute better translations!
      - A near-complete rewrite of the codebase

changes: []
